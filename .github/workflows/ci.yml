name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
        shell: bash
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib
      - name: Check source distribution installation
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c 'import fluvialseis'
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
