[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fluvialseis"
version = "0.1.0a2"
description = "Native Python spectra and fluvial model inversion for environmental seismology"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sardor Sobirov"}]
keywords = ["fluvial seismology", "environmental seismology", "river", "spectral analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2.1", "scipy>=1.15"]

[project.optional-dependencies]
test = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17"]

[project.urls]
Repository = "https://github.com/sardorsob/PyEnvSeis"
Issues = "https://github.com/sardorsob/PyEnvSeis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fluvialseis"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/GUIDE.md", "/LICENSE", "/CITATION.cff", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
files = ["src/fluvialseis"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
